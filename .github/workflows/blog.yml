name: Build blog
on:
  push:
    branches: [main]
    paths: ['blog/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: python3 blog/build.py
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add index.html updates articles topics about feed.xml
          git diff --cached --quiet || (git commit -m "Rebuild blog" && git push)
