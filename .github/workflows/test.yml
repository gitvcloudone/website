name: Engine tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install (exact versions from package-lock.json)
        run: npm ci --no-audit --no-fund
      - name: The site's SheetJS copy is the official release, byte for byte (from cdn.sheetjs.com)
        run: |
          curl -sSfL https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js -o "$RUNNER_TEMP/official-xlsx.js"
          cmp "$RUNNER_TEMP/official-xlsx.js" assets/vendor/xlsx-0.20.3.full.min.js
          echo "sha384-$(openssl dgst -sha384 -binary "$RUNNER_TEMP/official-xlsx.js" | openssl base64 -A)"
      - name: Golden, knowledge and studio tests (includes "vcf-design-studio/app is up to date with the source")
        run: npm test
      - name: Type check
        run: npm run typecheck
