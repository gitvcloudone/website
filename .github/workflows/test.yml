name: Engine tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Golden and knowledge tests (live page engine and TypeScript engine)
        run: npm test
      - name: Type check
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
