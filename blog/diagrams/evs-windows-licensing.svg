<!-- caption: Two ways to license Windows Server VMs on Amazon EVS -->
<svg font-family="Inter, -apple-system, Segoe UI, Roboto, Arial, sans-serif" viewBox="0 0 640 185" role="img" aria-label="Two ways to license Windows Server VMs on Amazon EVS" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs><rect x="20" y="60" width="150" height="64" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><text x="95.0" y="86.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a2e">Windows VM</text><text x="95.0" y="104.0" text-anchor="middle" font-size="12" fill="#6b7280">on Amazon EVS</text><rect x="250" y="14" width="370" height="64" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><text x="435.0" y="40.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a2e">Bring your own license</text><text x="435.0" y="58.0" text-anchor="middle" font-size="12" fill="#6b7280">VMs with license portability: no AWS charge</text><rect x="250" y="104" width="370" height="64" rx="8" fill="#fff4e0" stroke="#ff9900" stroke-width="1.5"/><text x="435.0" y="130.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a2e">Amazon EVS entitlement</text><text x="435.0" y="148.0" text-anchor="middle" font-size="12" fill="#6b7280">vCenter connector, billed per vCPU-hour</text><line x1="170" y1="82" x2="248" y2="50" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><line x1="170" y1="102" x2="248" y2="134" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/></svg>
