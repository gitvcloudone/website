<!-- caption: Memory tiering: the hypervisor keeps active pages in DRAM and moves cold pages to NVMe -->
<svg font-family="Inter, -apple-system, Segoe UI, Roboto, Arial, sans-serif" viewBox="0 0 640 190" role="img" aria-label="Memory tiering: the hypervisor keeps active pages in DRAM and moves cold pages to NVMe" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs><rect x="20" y="20" width="600" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="320.0" y="100.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a2e"></text><text x="36" y="44" font-size="13" fill="#1a1a2e" text-anchor="start" font-weight="600">ESX host with memory tiering (VCF 9.1)</text><rect x="40" y="62" width="250" height="90" rx="8" fill="#e8f4fd" stroke="#0073bb" stroke-width="1.5"/><text x="165.0" y="101.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a2e">Tier 0: DRAM</text><text x="165.0" y="119.0" text-anchor="middle" font-size="12" fill="#6b7280">active pages</text><rect x="350" y="62" width="250" height="90" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/><text x="475.0" y="101.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a2e">Tier 1: NVMe</text><text x="475.0" y="119.0" text-anchor="middle" font-size="12" fill="#6b7280">cold pages, 1 device or 2 mirrored</text><line x1="290" y1="95" x2="348" y2="95" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><line x1="348" y1="120" x2="292" y2="120" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><text x="320" y="88" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">cold</text><text x="320" y="138" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">hot</text></svg>
